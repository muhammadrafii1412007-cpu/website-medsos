<!DOCTYPE html>
<html lang="id">
<head>

  <style>
    :root {
      --bg1: #20c1f7 ;
      --bg2: #7c3aed;
      --bg3: #48ec4b;
      --card: rgba(255, 255, 255, 0.14);
      --card-hover: rgba(255, 255, 255, 0.24);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.75);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }
    .container { width: 100%; max-width: 440px; text-align: center; }

    .avatar {
      width: 112px; height: 112px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: grid; place-items: center;
      font-size: 44px; font-weight: 700;
      background: linear-gradient(135deg, #fbbf24, #ec4899);
      border: 4px solid rgba(255,255,255,0.6);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .handle { color: var(--muted); margin-bottom: 12px; }
    .bio { color: var(--muted); line-height: 1.6; margin-bottom: 32px; font-size: 0.97rem; }

    .links { display: flex; flex-direction: column; gap: 14px; }
    .link {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 20px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      text-decoration: none;
      text-align: left;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-3px);
      background: var(--card-hover);
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
      outline: none;
    }
    .icon {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: 12px;
      display: grid; place-items: center;
      color: #fff;
    }
    .icon svg { width: 26px; height: 26px; }
    .tiktok   { background: #111; }
    .instagram{ background: linear-gradient(45deg, #f9a825, #e1306c 50%, #833ab4); }
    .youtube  { background: #ff0000; }
    .whatsapp { background: #25d366; }

    .info { flex: 1; min-width: 0; }
    .info strong { display: block; font-size: 1.02rem; }
    .info span { font-size: 0.85rem; color: var(--muted); }
    .arrow { opacity: .7; font-size: 1.2rem; }

    footer { margin-top: 36px; font-size: 0.8rem; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
